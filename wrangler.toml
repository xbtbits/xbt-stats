name = "xbt-stats"
main = "worker/src/index.js"
routes = [{ pattern = "xbtstats.com", custom_domain = true }]
compatibility_date = "2026-09-01"

[assets]
directory = "./site"
binding = "ASSETS"
run_worker_first = ["/api/*"]
not_found_handling = "404-page"

[[d1_databases]]
binding = "DB"
database_name = "xbt-stats"
database_id = "72f9fd5f-b229-462e-9d58-ae9735122472"

[triggers]
crons = ["* * * * *"]

[observability]
enabled = false
