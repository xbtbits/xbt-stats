<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>XBT Stats link preview</title>
  <link rel="stylesheet" href="/css/site.css">
  <style>
    html, body { width: 400px; height: 210px; margin: 0; overflow: hidden; }
    .og { box-sizing: border-box; height: 210px; padding: 30px 26px 22px; display: flex; flex-direction: column; justify-content: space-between; }
    .og .top { width: 360px; }
    .og h1 { margin: 16px 0 0; font-family: var(--cyber); font-weight: 400; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink); line-height: 1.5; }
    .og p { margin: 4px 0 0; font-size: 10.5px; color: var(--ink-soft); }
    .og .url { font-family: var(--cyber); font-size: 10px; letter-spacing: 0.1em; color: var(--gold); }
  </style>
  <script src="/js/brand.js" defer></script>
</head>
<body>
  <div class="og">
    <div class="top">
      <a class="wordmark" href="/">XBT Stats</a>
      <h1>Live XBT network stats</h1>
      <p>Price · blocks · mining · fees · nodes · halving on the BLAKE2b chain</p>
    </div>
    <div class="url">xbtstats.com</div>
  </div>
</body>
</html>
